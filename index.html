<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Student Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
  <main class="container app-shell">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card glass-card">
          <div class="card-body">
            <div class="brand-lockup">
              <span class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
                  <path d="M43 27h5a7 7 0 0 1 0 14h-5" stroke="#8b634b" stroke-width="3.5" stroke-linecap="round"/>
                  <path d="M16 23h27v19a10 10 0 0 1-10 10h-7a10 10 0 0 1-10-10V23Z" fill="#fff0d9" stroke="#8b634b" stroke-width="2.5"/>
                  <path d="M23 17c-5-4 5-7 0-11m12 11c-5-4 5-7 0-11" stroke="#b38e6b" stroke-width="2.5" stroke-linecap="round"/>
                  <circle cx="24" cy="35" r="1.8" fill="#674632"/>
                  <circle cx="35" cy="35" r="1.8" fill="#674632"/>
                  <path d="M25 42q4.5 5 9 0" stroke="#674632" stroke-width="2" stroke-linecap="round"/>
                  <path d="M14 56q16 5 33 0" stroke="#b38e6b" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </span>
              <div class="brand-name">
                <strong lang="ar" dir="rtl">TEST NOW </strong>
                <span>STUDENT QUIZ</span>
              </div>
            </div>
            <h1 class="h3 text-center page-title">Student Login</h1>
            <div id="message" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center auth-footer">New student? <a href="register.html">Register</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
