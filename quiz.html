<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | Student Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/quiz.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
              <h1 class="h3 mb-0">Student Quiz</h1>
              <button id="logoutButton" type="button" class="btn btn-outline-danger">Logout</button>
            </div>
            <p class="mb-3">Student: <strong id="studentName"></strong></p>
            <div id="message" class="alert alert-danger d-none" role="alert"></div>
            <p id="loadingMessage" class="text-secondary" role="status">Loading questions...</p>
            <div id="quizContent" class="d-none">
              <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
                <span id="questionNumber" class="fw-semibold"></span>
                <span id="progressText" class="text-secondary"></span>
              </div>
              <div id="quizProgress" class="progress mb-4" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progressBar" class="progress-bar"></div>
              </div>
              <form id="quizForm" novalidate>
                <fieldset>
                  <legend id="questionText" class="h5 mb-3"></legend>
                  <div id="answers"></div>
                </fieldset>
                <button id="nextButton" type="submit" class="btn btn-primary mt-3">Next</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
